<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatGPT 웹페이지 만들기</title>
  <link rel="stylesheet" href="https://s3.ap-northeast-2.amazonaws.com/materials.spartacodingclub.kr/easygpt/default.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jl+jjXkk+Q2h455rYXk/7HAuoJl+0I4" crossorigin="anonymous"></script>
  <style>
    .card-img-top {
      height: 200px;
      object-fit: cover;
    }
    .card {
      transition: transform 0.3s ease;
    }
    .card:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <!-- Hero Section -->
  <section class="bg-dark text-white text-center p-5">
    <div class="container">
      <h1 class="display-4">MJY 사진공유 페이지</h1>
      <p class="lead">사진을 공유합니다</p>
    </div>
  </section>

  <!-- 구성요소 -->
  <div class="container my-5">
    <div class="row">
      
      <!-- 카드 1 -->
      <div class="col-md-4 mb-4">
        <div class="card">
          <img src="https://images.pexels.com/photos/417173/pexels-photo-417173.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=750&w=1260" class="card-img-top" alt="산과 호수 이미지">
          <div class="card-body">
            <h5 class="card-title">눈부신 산과 호수</h5>
            <h6 class="card-subtitle mb-2 text-muted">자연 풍경</h6>
            <p class="card-text">맑은 호수와 웅장한 산이 어우러진 멋진 자연의 모습을 담았습니다.</p>
          </div>
        </div>
      </div>

      <!-- 카드 2 -->
      <div class="col-md-4 mb-4">
        <div class="card">
          <img src="https://images.pexels.com/photos/3408744/pexels-photo-3408744.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=750&w=1260" class="card-img-top" alt="도시 야경 이미지">
          <div class="card-body">
            <h5 class="card-title">빛나는 도시의 밤</h5>
            <h6 class="card-subtitle mb-2 text-muted">도시 풍경</h6>
            <p class="card-text">고층 빌딩과 반짝이는 불빛이 만들어내는 아름다운 야경을 담았습니다.</p>
          </div>
        </div>
      </div>

      <!-- 카드 3 -->
      <div class="col-md-4 mb-4">
        <div class="card">
          <img src="https://images.pexels.com/photos/355241/pexels-photo-355241.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=750&w=1260" class="card-img-top" alt="해변 이미지">
          <div class="card-body">
            <h5 class="card-title">고요한 해변</h5>
            <h6 class="card-subtitle mb-2 text-muted">바다 풍경</h6>
            <p class="card-text">끝없이 펼쳐진 모래사장과 잔잔한 파도가 인상적인 해변 사진입니다.</p>
          </div>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
